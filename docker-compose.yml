services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aidoc-db
    environment:
      POSTGRES_DB: aidoc
      POSTGRES_USER: aidoc
      POSTGRES_PASSWORD: aidoc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidoc -d aidoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: aidoc-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=aidoc;Username=aidoc;Password=aidoc_dev_password"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
